<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>纹兽战记 · 主题曲试听</title>
<style>
 body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:linear-gradient(135deg,#103a2a,#0f1117 55%,#0c2a4d);color:#e8ecf4;font-family:"Microsoft YaHei",system-ui,sans-serif}
 h1{font-size:30px;margin:0;letter-spacing:2px}.sub{color:#8b95ad;font-size:14px;margin-top:-12px}
 .btns{display:flex;gap:16px}
 button{font-size:18px;padding:14px 30px;border-radius:14px;border:2px solid #2e3650;background:#1a1f2e;color:#cfe;cursor:pointer;transition:.15s}
 button:hover{border-color:#ffcf5a;transform:translateY(-2px)}#play{border-color:#4ade80;color:#7fe0a0}
 .eq{display:flex;gap:4px;height:50px;align-items:flex-end}.eq i{width:7px;background:#5ad17a;border-radius:3px;height:8px;transition:height .1s}
 .info{color:#8b95ad;font-size:12px;max-width:440px;text-align:center;line-height:1.6}
</style></head><body>
 <div class="eq" id="eq"></div><h1>🎮 纹兽战记 · 主题曲</h1>
 <div class="sub">原创 chiptune · 宝可梦风双脉冲三度和声 · C大调 · 158 BPM · 极简鼓</div>
 <div class="btns"><button id="play">▶ 播放</button><button id="stop">⏸ 停止</button></div>
 <div class="info">原创作曲(非任何现有曲目复制)。没声音就先点"播放"。</div>
<script>
const NF={C2:65.41,E2:82.41,F2:87.31,G2:98,A2:110,B2:123.47,C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,E4:329.63,F4:349.23,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77,C6:1046.5,D6:1174.66,E6:1318.51};
const SCALE=['E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5','C6','D6','E6'];
function third(n){const i=SCALE.indexOf(n);return i>=2?SCALE[i-2]:null;}
const BPM=158,BEAT=60/BPM;
const MELODY=[['E5',.5],['G5',.5],['C6',.5],['G5',.5],['E5',.5],['C5',.5],['E5',1],['D5',.5],['G5',.5],['B5',.5],['G5',.5],['D5',.5],['B4',.5],['D5',1],['C5',.5],['E5',.5],['A5',.5],['E5',.5],['C5',.5],['A4',.5],['C5',1],['B4',.5],['E5',.5],['G5',.5],['E5',.5],['B4',.5],['G4',.5],['B4',1],['A5',.5],['F5',.5],['A5',.5],['C6',.5],['A5',.5],['F5',.5],['C5',1],['G5',.5],['E5',.5],['C6',.5],['E5',.5],['G5',1],['C5',1],['F5',.5],['A5',.5],['C6',.5],['A5',.5],['F5',1],['A5',1],['G5',.5],['B5',.5],['D6',.5],['B5',.5],['G5',1],['D5',1],['C6',1],['G5',.5],['E5',.5],['G5',1],['C6',1],['B5',1],['G5',.5],['D5',.5],['G5',2],['A5',1],['E5',.5],['C5',.5],['E5',2],['G5',1],['E5',.5],['B4',.5],['E5',2],['A5',1],['C6',.5],['A5',.5],['F5',2],['E5',.5],['G5',.5],['C6',.5],['E6',.5],['C6',2],['A5',1],['F5',.5],['C5',.5],['F5',2],['D6',.5],['B5',.5],['G5',.5],['D5',.5],['G5',2]];
const CHORDS=['C','G','Am','Em','F','C','F','G','C','G','Am','Em','F','C','F','G'];
const R3={C:['C2','G2','C3'],G:['G2','D3','G3'],Am:['A2','E3','A3'],Em:['E2','B2','E3'],F:['F2','C3','F3']};
const BASS=[];CHORDS.forEach(c=>{const r=R3[c];[0,1,2,1,0,1,2,1].forEach(k=>BASS.push(r[k]));});
let ac=null,on=false,timer=null,mg=null;
function getac(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac;}
function gain(){if(!mg){mg=getac().createGain();mg.gain.value=0.55;mg.connect(getac().destination);}return mg;}
function voice(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d*0.9);o.connect(g).connect(gain());o.start(t);o.stop(t+d);}
function tick(t,soft){const dur=soft?0.025:0.07,n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=soft?0.01:0.03;const f=ac.createBiquadFilter();f.type=soft?'highpass':'lowpass';f.frequency.value=soft?8000:200;s.connect(f).connect(gain());s.start(t);}
function schedule(){if(!on)return;const t0=getac().currentTime+0.06;let t=t0;
 MELODY.forEach(([n,b])=>{if(NF[n]){voice(NF[n],t,b*BEAT,'square',0.09);const h=third(n);if(h&&NF[h])voice(NF[h],t,b*BEAT,'square',0.05);}t+=b*BEAT;});
 t=t0;BASS.forEach(n=>{if(NF[n])voice(NF[n],t,BEAT*0.46,'triangle',0.12);t+=BEAT*0.5;});
 for(let bar=0;bar<16;bar++){tick(t0+bar*4*BEAT,false);tick(t0+(bar*4+1)*BEAT,true);tick(t0+(bar*4+3)*BEAT,true);}
 timer=setTimeout(schedule,(64*BEAT-0.05)*1000);}
function start(){getac().resume();on=true;if(mg)mg.gain.value=0.55;if(!timer)schedule();anim();}
function stop(){on=false;if(mg)mg.gain.value=0;if(timer){clearTimeout(timer);timer=null;}}
document.getElementById('play').onclick=start;document.getElementById('stop').onclick=stop;
const eq=document.getElementById('eq');for(let i=0;i<14;i++)eq.appendChild(document.createElement('i'));
function anim(){if(!on)return;[...eq.children].forEach(b=>b.style.height=(8+Math.random()*42)+'px');setTimeout(anim,110);}
</script></body></html>
